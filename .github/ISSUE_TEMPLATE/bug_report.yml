name: Bug report
description: Report a reproducible defect in the Python SDK
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, private AgentCards, or unredacted protocol dumps.
  - type: input
    id: version
    attributes:
      label: SDK version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include Python version, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
